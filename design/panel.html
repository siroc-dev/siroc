<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Siroc UI preview</title>
    <link rel="icon" href="../site/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@360;480;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #0c0b0a;
        --panel: #12110f;
        --card: #171512;
        --line: rgba(244, 234, 220, 0.1);
        --paper: #f4eadc;
        --muted: #a89884;
        --dust: #e2783a;
        --dust-2: #ff9a55;
        --ok: #8fbf7a;
        --bad: #e15b4a;
        --warn: #e2b15a;
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; }
      body {
        font-family: Outfit, sans-serif;
        background: var(--ink);
        color: var(--paper);
        letter-spacing: 0.01em;
      }
      button, input, select { font: inherit; color: inherit; }
      .app { display: grid; grid-template-columns: 232px 1fr; min-height: 100%; }
      .sider {
        position: sticky;
        top: 0;
        height: 100vh;
        background: linear-gradient(180deg, #141210, #0c0b0a 40%);
        border-right: 1px solid var(--line);
        padding: 18px 12px;
        display: flex;
        flex-direction: column;
      }
      .brand { display: flex; gap: 12px; align-items: center; padding: 6px 10px 18px; }
      .mark { width: 36px; height: 36px; flex: none; }
      .brand small { display: block; color: var(--muted); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; }
      .brand strong { font-size: 18px; font-weight: 600; }
      .brand em { font-style: normal; color: var(--dust); font-family: "IBM Plex Mono", monospace; font-size: 11px; }
      nav { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
      nav button {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--muted);
        cursor: pointer;
        position: relative;
      }
      nav button:hover { color: var(--paper); background: rgba(244, 234, 220, 0.04); }
      nav button.on {
        color: var(--paper);
        background: rgba(226, 120, 58, 0.12);
      }
      nav button.on::before {
        content: "";
        position: absolute;
        left: 0;
        top: 8px;
        bottom: 8px;
        width: 2px;
        background: var(--dust);
        border-radius: 2px;
      }
      .ico { width: 16px; text-align: center; font-family: "IBM Plex Mono", monospace; font-size: 11px; color: var(--dust); }
      .main { min-width: 0; }
      header.top {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        position: sticky;
        top: 0;
        background: rgba(12, 11, 10, 0.9);
        backdrop-filter: blur(10px);
        z-index: 2;
      }
      header.top h1 { margin: 0; font-size: 15px; font-weight: 480; }
      header.top p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
      .who { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 13px; }
      .ghost, .solid {
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: transparent;
      }
      .ghost:hover { border-color: var(--dust); color: var(--paper); }
      .solid { background: var(--dust); color: #1a100a; border-color: transparent; font-weight: 600; }
      .solid:hover { background: var(--dust-2); }
      .stage { padding: 26px 28px 48px; }
      .view { display: none; animation: rise 0.35s ease; }
      .view.on { display: block; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      .grid { display: grid; gap: 14px; }
      .g4 { grid-template-columns: repeat(4, 1fr); }
      .g3 { grid-template-columns: repeat(3, 1fr); }
      .g2 { grid-template-columns: 1.4fr 1fr; }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px 16px 14px;
        position: relative;
        overflow: hidden;
      }
      .card:hover { border-color: rgba(226, 120, 58, 0.45); }
      .card h3 { margin: 0 0 8px; font-size: 13px; font-weight: 480; color: var(--muted); }
      .stat { font-family: "IBM Plex Mono", monospace; font-size: 28px; font-weight: 500; }
      .sub { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .bar { height: 4px; background: #2a2622; border-radius: 99px; margin-top: 12px; overflow: hidden; }
      .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--dust), var(--dust-2)); width: 40%; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; color: var(--muted); font-weight: 480; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px; }
      td { padding: 10px 8px; border-top: 1px solid var(--line); }
      tr:hover td { background: rgba(244, 234, 220, 0.03); }
      .tag { font-family: "IBM Plex Mono", monospace; font-size: 11px; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); }
      .tag.ok { color: var(--ok); border-color: rgba(143, 191, 122, 0.4); }
      .tag.bad { color: var(--bad); border-color: rgba(225, 91, 74, 0.45); }
      .tag.warn { color: var(--warn); border-color: rgba(226, 177, 90, 0.4); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
      .field, select.field {
        background: #0e0d0c;
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 8px 10px;
        min-width: 180px;
      }
      .split { display: grid; grid-template-columns: 220px 1fr; gap: 14px; min-height: 420px; }
      .list button {
        width: 100%;
        text-align: left;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 10px 8px;
        cursor: pointer;
        color: var(--muted);
      }
      .list button.on { color: var(--paper); background: rgba(226, 120, 58, 0.1); }
      pre.log {
        margin: 0;
        background: #0a0908;
        border-radius: 8px;
        padding: 14px;
        min-height: 280px;
        font-family: "IBM Plex Mono", monospace;
        font-size: 12px;
        line-height: 1.55;
        color: #d9cbb8;
        overflow: auto;
      }
      .login {
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(600px 280px at 70% 20%, rgba(226, 120, 58, 0.16), transparent 60%),
          var(--ink);
      }
      .login form {
        width: min(420px, calc(100% - 32px));
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 28px;
      }
      .login .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .login h2, .login .note { text-align: center; }
      .login h2 { margin: 0; font-weight: 600; }
      .login label { display: block; margin-top: 14px; font-size: 12px; color: var(--muted); }
      .login input { width: 100%; margin-top: 6px; }
      .note { color: var(--muted); font-size: 12px; }
      @media (max-width: 980px) {
        .app { grid-template-columns: 1fr; }
        .sider { position: relative; height: auto; }
        .g4, .g3, .g2, .split { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <section class="login" id="login">
      <form id="enter">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#14110f"/>
            <path d="M6 20c4-8 8-10 12-6s6 2 8-4" stroke="#e2783a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M7 24c5-6 9-7 12-3s5 1 7-3" stroke="#f4eadc" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
          </svg>
          <h2>Siroc</h2>
        </div>
        <p class="note" style="margin-top: 10px">Linux hosting control panel.</p>
        <label>Username<input class="field" value="admin" /></label>
        <label>Password<input class="field" type="password" value="••••••••" /></label>
        <div class="row" style="margin-top: 18px">
          <button class="solid" type="submit">Enter panel</button>
        </div>
      </form>
    </section>

    <div class="app" id="shell" hidden>
      <aside class="sider">
        <div class="brand">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" rx="8" fill="#14110f"/>
            <path d="M6 20c4-8 8-10 12-6s6 2 8-4" stroke="#e2783a" stroke-width="2.2" stroke-linecap="round" fill="none"/>
            <path d="M7 24c5-6 9-7 12-3s5 1 7-3" stroke="#f4eadc" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.85"/>
          </svg>
          <div>
            <small>Control panel</small>
            <strong>Siroc</strong>
            <em>v0.2.29</em>
          </div>
        </div>
        <nav id="nav"></nav>
      </aside>
      <div class="main">
        <header class="top">
          <div>
            <h1 id="title">Dashboard</h1>
            <p id="blurb">Host load, accounts, and the stack on this machine.</p>
          </div>
          <div class="who">
            <span>admin</span>
            <button class="ghost" type="button">Password</button>
            <button class="ghost" type="button" id="out">Logout</button>
          </div>
        </header>
        <div class="stage" id="stage"></div>
      </div>
    </div>
    <script>
      const pages = [
        ["dash", "Dashboard", "Host load, accounts, and the stack on this machine.", "01"],
        ["accounts", "Accounts", "Linux users, home, and quota.", "02"],
        ["sites", "Websites", "Domains, PHP, and Git deploy.", "03"],
        ["php", "PHP", "FPM pool and php.ini for one account.", "04"],
        ["files", "Files", "Fifty files a page, path jump, preview, rename.", "05"],
        ["term", "Terminal", "Shell as the selected account.", "06"],
        ["soft", "Software", "Install and the live job log.", "07"],
        ["sec", "Security", "Firewall, WAF, and Fail2ban whitelist.", "08"],
        ["logs", "Logs", "Clear one file or every log for a site.", "09"],
        ["db", "Databases", "MySQL users, import, and Redis.", "10"],
        ["bak", "Backup", "Destinations and cron schedules.", "11"],
        ["tools", "System tools", "DNS, time, disk, and network.", "12"],
        ["set", "Settings", "Theme, logo, and services.", "13"],
        ["mon", "Monitoring", "Load history and alerts.", "14"],
        ["stat", "Status", "Nginx, Apache, PHP-FPM, and the database.", "15"],
      ];

      const bodies = {
        dash: `
          <div class="grid g4">
            <article class="card"><h3>CPU</h3><div class="stat">18%</div><div class="sub">4 cores · load 0.42</div><div class="bar"><span style="width:18%"></span></div></article>
            <article class="card"><h3>Memory</h3><div class="stat">6.1G</div><div class="sub">of 16G</div><div class="bar"><span style="width:38%"></span></div></article>
            <article class="card"><h3>Disk</h3><div class="stat">41%</div><div class="sub">/  82G used</div><div class="bar"><span style="width:41%"></span></div></article>
            <article class="card"><h3>Uptime</h3><div class="stat">14d</div><div class="sub">agent connected</div><div class="bar"><span style="width:100%"></span></div></article>
          </div>
          <div class="grid g4" style="margin-top:14px">
            <article class="card"><h3>Accounts</h3><div class="stat">12</div></article>
            <article class="card"><h3>Websites</h3><div class="stat">27</div></article>
            <article class="card"><h3>Databases</h3><div class="stat">19</div></article>
            <article class="card"><h3>Banned now</h3><div class="stat">4</div></article>
          </div>
          <article class="card" style="margin-top:14px">
            <h3>Accounts by disk</h3>
            <table><thead><tr><th>User</th><th>Sites</th><th>Disk</th><th>PHP</th></tr></thead>
            <tbody>
              <tr><td>mangablackcat</td><td>3</td><td>4.8G</td><td>8.4</td></tr>
              <tr><td>shop</td><td>1</td><td>1.2G</td><td>8.3</td></tr>
              <tr><td>api</td><td>2</td><td>640M</td><td>8.4</td></tr>
            </tbody></table>
          </article>`,
        accounts: `
          <div class="row"><button class="solid">Add account</button><input class="field" placeholder="Search users" /></div>
          <article class="card"><table><thead><tr><th>User</th><th>Home</th><th>Quota</th><th>SSH</th><th></th></tr></thead>
          <tbody>
            <tr><td>mangablackcat</td><td>/home/mangablackcat</td><td>10G</td><td><span class="tag ok">on</span></td><td><button class="ghost">Open</button></td></tr>
            <tr><td>shop</td><td>/home/shop</td><td>none</td><td><span class="tag ok">on</span></td><td><button class="ghost">Open</button></td></tr>
          </tbody></table></article>`,
        sites: `
          <div class="row"><button class="solid">Add website</button><input class="field" placeholder="Domain" /></div>
          <article class="card"><table><thead><tr><th>Domain</th><th>User</th><th>PHP</th><th>SSL</th><th>Deploy</th></tr></thead>
          <tbody>
            <tr><td>mangablackcat.com</td><td>mangablackcat</td><td>8.4</td><td><span class="tag ok">Let's Encrypt</span></td><td><span class="tag">a1b2c3d Fix storage link</span></td></tr>
            <tr><td>shop.example.com</td><td>shop</td><td>8.3</td><td><span class="tag warn">self-signed</span></td><td><span class="tag">—</span></td></tr>
          </tbody></table></article>
          <article class="card" style="margin-top:14px"><h3>Latest deploy</h3><div class="stat" style="font-size:18px">a1b2c3d4e5f6</div><div class="sub">Fix storage link · Ada · 2026-10-05 03:12</div></article>`,
        php: `
          <div class="row"><select class="field"><option>mangablackcat</option></select><select class="field"><option>PHP 8.4</option><option>PHP 8.3</option></select><button class="solid">Save</button></div>
          <div class="grid g3">
            <article class="card"><h3>memory_limit</h3><input class="field" value="256M" /></article>
            <article class="card"><h3>upload_max_filesize</h3><input class="field" value="10G" /></article>
            <article class="card"><h3>Base directory</h3><div class="stat" style="font-size:16px">/home/mangablackcat</div><div class="sub">open_basedir and chdir</div></article>
          </div>`,
        files: `
          <div class="row"><input class="field" value="/home/mangablackcat/domains/mangablackcat.com/public_html" style="min-width:420px" /><button class="solid">Open</button><button class="ghost">Rename</button></div>
          <article class="card"><table><thead><tr><th>Name</th><th>Size</th><th>Modified</th></tr></thead>
          <tbody>
            <tr><td>index.php</td><td>1.2K</td><td>today</td></tr>
            <tr><td>cover.webp</td><td>240K</td><td>yesterday</td></tr>
            <tr><td>storage</td><td>link</td><td>today</td></tr>
          </tbody></table><p class="note">Page 1 of 3 · 50 files</p></article>`,
        term: `<article class="card"><pre class="log">mangablackcat@host:~$ ls domains
mangablackcat.com
mangablackcat@host:~$ _</pre></article>`,
        soft: `
          <div class="grid g3">
            <article class="card"><h3>Nginx</h3><span class="tag ok">installed</span><div class="sub">1.31 · lua · VOD</div></article>
            <article class="card"><h3>MariaDB</h3><span class="tag ok">installed</span><div class="sub">11.4 from apt</div></article>
            <article class="card"><h3>Fail2ban</h3><span class="tag ok">active</span><div class="sub">jails running</div></article>
          </div>
          <article class="card" style="margin-top:14px"><h3>Install log</h3><pre class="log"># nginx
unpacking lua-resty-core 0.1.28
nginx: configuration test is successful</pre></article>`,
        sec: `
          <div class="row"><button class="ghost">Firewall</button><button class="ghost">WAF</button><button class="solid">Fail2ban</button></div>
          <article class="card"><h3>Whitelist</h3>
            <div class="row"><input class="field" placeholder="203.0.113.10 or 203.0.113.0/24" /><button class="solid">Add</button></div>
            <table><thead><tr><th>Address</th><th></th></tr></thead><tbody><tr><td>203.0.113.10</td><td><button class="ghost">Remove</button></td></tr></tbody></table>
            <p class="note">Localhost is always ignored.</p>
          </article>`,
        logs: `
          <div class="row"><select class="field"><option>mangablackcat.com</option></select><button class="ghost">Clear</button><button class="solid">Clear all</button></div>
          <div class="split">
            <article class="card list"><button class="on">nginx access</button><button>nginx error</button><button>apache error</button><button>laravel.log</button></article>
            <article class="card"><pre class="log">10.0.0.8 - - [05/Oct/2026:03:01:00] "GET /latest HTTP/1.1" 200
127.0.0.1 - - [05/Oct/2026:03:02:11] "GET / HTTP/1.1" 200</pre></article>
          </div>`,
        db: `
          <div class="row"><button class="solid">Add database</button><button class="ghost">Import</button></div>
          <article class="card"><table><thead><tr><th>Name</th><th>User</th><th>Size</th></tr></thead>
          <tbody><tr><td>manga</td><td>manga</td><td>180M</td></tr><tr><td>shop</td><td>shop</td><td>22M</td></tr></tbody></table></article>`,
        bak: `
          <div class="row"><button class="ghost">Add destination</button><button class="solid">Add schedule</button><button class="ghost">Run backup</button></div>
          <article class="card"><h3>Schedules</h3><table><thead><tr><th>Name</th><th>Account</th><th>When</th><th>Keep</th></tr></thead>
          <tbody><tr><td>Backup all accounts</td><td>All</td><td>Daily at 01:30</td><td>3</td></tr></tbody></table>
          <p class="note">/etc/cron.d/siroc-backup</p></article>`,
        tools: `
          <div class="grid g2">
            <article class="card"><h3>DNS</h3><div class="sub">1.1.1.1 · 8.8.8.8</div></article>
            <article class="card"><h3>Timezone</h3><div class="sub">Asia/Bangkok</div></article>
          </div>`,
        set: `
          <div class="grid g2">
            <article class="card"><h3>Theme</h3><div class="row"><button class="solid">Dark</button><button class="ghost">Light</button><button class="ghost">Auto</button></div><div class="sub">Accent stays dust orange.</div></article>
            <article class="card"><h3>Logo</h3><img alt="" src="../site/logo.png" style="height:48px" /></article>
          </div>`,
        mon: `<article class="card"><h3>Load</h3><div class="bar"><span style="width:22%"></span></div><p class="note">1m 0.42 · 5m 0.38 · 15m 0.31</p></article>`,
        stat: `
          <div class="grid g3">
            <article class="card"><h3>Nginx</h3><span class="tag ok">active</span></article>
            <article class="card"><h3>Apache</h3><span class="tag ok">active</span></article>
            <article class="card"><h3>PHP-FPM 8.4</h3><span class="tag ok">active</span></article>
            <article class="card"><h3>MariaDB</h3><span class="tag ok">active</span></article>
            <article class="card"><h3>Redis</h3><span class="tag warn">optional</span></article>
          </div>`,
      };

      const nav = document.getElementById("nav");
      const stage = document.getElementById("stage");
      pages.forEach(([id, label, blurb, num]) => {
        const b = document.createElement("button");
        b.dataset.id = id;
        b.innerHTML = `<span class="ico">${num}</span><span>${label}</span>`;
        b.onclick = () => show(id);
        nav.appendChild(b);
        const view = document.createElement("section");
        view.className = "view";
        view.id = "view-" + id;
        view.dataset.blurb = blurb;
        view.dataset.title = label;
        view.innerHTML = bodies[id];
        stage.appendChild(view);
      });

      function show(id) {
        document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("on", b.dataset.id === id));
        document.querySelectorAll(".view").forEach((v) => {
          const on = v.id === "view-" + id;
          v.classList.toggle("on", on);
          if (on) {
            document.getElementById("title").textContent = v.dataset.title;
            document.getElementById("blurb").textContent = v.dataset.blurb;
          }
        });
      }
      document.getElementById("enter").onsubmit = (e) => {
        e.preventDefault();
        document.getElementById("login").hidden = true;
        document.getElementById("shell").hidden = false;
        show("dash");
      };
      document.getElementById("out").onclick = () => {
        document.getElementById("shell").hidden = true;
        document.getElementById("login").hidden = false;
      };
    </script>
  </body>
</html>

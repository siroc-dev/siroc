name: Check site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "VERSION"
      - "wrangler.toml"
      - "scripts/stamp-site.sh"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - "VERSION"
      - "wrangler.toml"
      - "scripts/stamp-site.sh"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  stamp:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Stamp public URLs
        env:
          SIROC_RELEASE_PUBLIC_BASE: ${{ vars.SIROC_RELEASE_PUBLIC_BASE }}
          SIROC_SITE_PUBLIC_BASE: ${{ vars.SIROC_SITE_PUBLIC_BASE }}
        run: bash scripts/stamp-site.sh

      - name: Site still points at the public channel
        run: |
          set -euo pipefail
          grep -q 'id="version">' site/index.html
          grep -q 'get.siroc.dev' site/index.html site/docs/index.html

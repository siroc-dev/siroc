name: Release to R2

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (defaults to VERSION file)"
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm --prefix web ci

      - name: Predeploy checks
        run: bash scripts/predeploy.sh

      - name: Build package
        run: bash scripts/package.sh

      - name: Write latest.json
        id: meta
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_BASE: ${{ vars.SIROC_RELEASE_PUBLIC_BASE }}
        run: |
          set -euo pipefail
          VER="${INPUT_VERSION:-}"
          if [ -z "$VER" ]; then
            VER="$(tr -d '[:space:]' < VERSION)"
          fi
          VER="${VER#v}"
          BASE="${RELEASE_BASE:-https://get.siroc.dev}"
          BASE="${BASE%/}"
          PKG="dist/siroc-linux-amd64.tar.gz"
          SHA="$(sha256sum "$PKG" | awk '{print $1}')"
          URL="${BASE}/siroc-linux-amd64.tar.gz"
          python3 -c 'import json,sys; print(json.dumps({"version":sys.argv[1],"url":sys.argv[2],"sha256":sys.argv[3]}, indent=2))' "$VER" "$URL" "$SHA" > dist/latest.json
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Published metadata:"
          cat dist/latest.json

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            echo "Add GitHub secrets R2_ACCESS_KEY_ID and R2_SECRET_ACCESS_KEY." >&2
            echo "Create them in Cloudflare → R2 → Manage R2 API Tokens → Object Read & Write on siroc-cp." >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Add GitHub secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          VER="${{ steps.meta.outputs.version }}"
          aws s3 cp dist/siroc-linux-amd64.tar.gz "s3://siroc-cp/siroc-linux-amd64.tar.gz" \
            --endpoint-url "$ENDPOINT" --content-type application/gzip
          aws s3 cp dist/siroc-linux-amd64.tar.gz "s3://siroc-cp/${VER}/siroc-linux-amd64.tar.gz" \
            --endpoint-url "$ENDPOINT" --content-type application/gzip
          aws s3 cp dist/latest.json "s3://siroc-cp/latest.json" \
            --endpoint-url "$ENDPOINT" --content-type application/json
